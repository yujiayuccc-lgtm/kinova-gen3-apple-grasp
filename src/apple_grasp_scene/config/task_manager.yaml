pick_apple_action_server:
  ros__parameters:
    viewpoint_names:
      - center
      - right
      - left
      - near
      - near_extended
      - edge_recovery
      - far
    viewpoint_x: [0.680, 0.620, 0.640, 0.600, 0.520, 0.520, 0.700]
    viewpoint_y: [-0.260, -0.380, -0.160, -0.260, -0.260, -0.160, -0.260]
    viewpoint_z: [0.400, 0.400, 0.380, 0.380, 0.400, 0.360, 0.320]

    # Add a serpentine, multi-height observation grid after the six viewpoints
    # already verified on the physical robot. New grid points remain preview-only
    # until they have passed planning review and low-speed commissioning.
    viewpoint_grid_enabled: true
    viewpoint_grid_min_x: 0.55
    viewpoint_grid_max_x: 0.75
    viewpoint_grid_min_y: -0.42
    viewpoint_grid_max_y: -0.10
    viewpoint_grid_step_x: 0.10
    viewpoint_grid_step_y: 0.08
    viewpoint_grid_z: [0.380, 0.420]
    verified_viewpoint_names:
      - center
      - right
      - left
      - near
      - near_extended
      - edge_recovery
      - far
      - grid_01
      - grid_02
      - grid_03
      - grid_05
      - grid_21

    # Visual-search bounds. Grasp execution remains disabled and requires its
    # own separately commissioned workspace limits.
    workspace_min_x: 0.50
    workspace_max_x: 0.80
    workspace_min_y: -0.45
    workspace_max_y: -0.10
    apple_min_z: 0.025
    apple_max_z: 0.060
    apple_min_radius: 0.025
    apple_max_radius: 0.055
    min_fit_points: 1000
    max_fit_residual: 0.003

    dogleg_threshold: 0.075
    pregrasp_height: 0.200
    grasp_height: 0.150
    lift_height: 0.200

